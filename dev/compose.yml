name: go-ttdb-dev
services:
  tt:
    build:
      context: ..
      dockerfile: dev/Dockerfile
      args:
        TT_IMAGE: ${TT_IMAGE:-}
    image: go-ttdb-dev:latest
    container_name: go-ttdb-dev
    stop_grace_period: 30s
    volumes:
      - ..:/src
      - tt_instance:/usr/tt/instance1
      - gocache:/home/oracle/.cache
      - gomod:/home/oracle/go
volumes:
  tt_instance:
  gocache:
  gomod:
